    <script>
        function updateSyncBtnLabel(browserType) {
            const tabBtn = document.getElementById('btnSyncGpmTab');
            const label = browserType === 'genlogin' ? 'Đồng Bộ' : 'Đồng Bộ';
            if (tabBtn) {
                tabBtn.innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> ${label}`;
            }
        }

        async function loadActiveBrowser() {
            try {
                const sel = document.getElementById('selectActiveBrowser');
                let saved = localStorage.getItem('active_browser_type');
                if (saved === 'auto') saved = 'gpm';
                if (sel && saved) {
                    sel.value = saved;
                    updateSyncBtnLabel(saved);
                }

                const res = await fetch('/api/v2/browsers/active');
                if (!res.ok) return;
                const data = await res.json();
                let active = data.active_browser;
                if (active === 'auto') active = 'gpm';
                if (sel && active) {
                    sel.value = active;
                    updateSyncBtnLabel(active);
                    try { localStorage.setItem('active_browser_type', active); } catch (e) { }
                }
            } catch (e) { }
        }

        async function changeActiveBrowser(browserType) {
            try {
                try { localStorage.setItem('active_browser_type', browserType); } catch (e) { }
                updateSyncBtnLabel(browserType);
                const res = await fetch('/api/v2/browsers/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ browser: browserType })
                });
                const data = await res.json();
                if (data.success) {
                    if (typeof showToast === 'function') {
                        showToast(data.message, 'success');
                    }
                    if (typeof syncGPMProfiles === 'function') {
                        syncGPMProfiles();
                    }
                }
            } catch (e) {
                console.error('Lỗi đổi trình duyệt:', e);
            }
        }
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', loadActiveBrowser);
        } else {
            loadActiveBrowser();
        }
    </script>
